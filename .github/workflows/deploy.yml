name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'config.yaml'
      - 'SOUL.md'
      - 'scripts/**'
      - 'systemd/**'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy & Restart Hermes Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment script on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          passphrase: ${{ secrets.VPS_PASSPHRASE || '' }}
          script_stop: true
          script: |
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/root/VPS-Agent' }}"
            if [ ! -d "${DEPLOY_PATH}" ]; then
              echo "Error: Directory ${DEPLOY_PATH} not found on VPS!" >&2
              exit 1
            fi
            cd "${DEPLOY_PATH}"
            sudo bash scripts/manage.sh update
